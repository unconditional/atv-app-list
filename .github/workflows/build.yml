name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.3.1'

      - name: Compute version name
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Signing material lives only in repo secrets: the keystore is decoded
      # into the build workspace and never cached or logged.
      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          else
            echo "KEYSTORE_BASE64 secret not set: release build will stay unsigned"
          fi

      - name: Build release APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_FILE: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="${VERSION_NAME}" \
            :app:assembleRelease

      - name: Ensure release APK is signed
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          unsigned=$(ls app/build/outputs/apk/release/ | grep -c 'unsigned' || true)
          if [ "$unsigned" -gt 0 ]; then
            echo "::error::Release APK is unsigned - configure KEYSTORE_BASE64/STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets, then re-run."
            exit 1
          fi

      - name: Stage APK
        shell: bash
        run: cp app/build/outputs/apk/release/*.apk atv-app-list.apk

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: atv-app-list-apk
          path: atv-app-list.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atv-app-list-apk

      # Rolling channel stays continuously served: refresh the asset in the
      # existing release instead of delete-then-recreate (no 404 window).
      - name: Refresh rolling latest release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          NOTES="Automatic build of commit ${SHA}.
          Direct download: https://github.com/unconditional/atv-app-list/releases/latest/download/atv-app-list.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest atv-app-list.apk --clobber
            gh release edit latest --title "latest (auto-build)" --notes "$NOTES"
          else
            gh release create latest atv-app-list.apk \
              --title "latest (auto-build)" \
              --notes "$NOTES" \
              --target main
          fi

      - name: Create tag release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" atv-app-list.apk \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}." \
            --latest
