name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Compute version name
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        shell: bash
        run: |
          gradle --no-daemon \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="${{ steps.ver.outputs.name }}" \
            :app:assembleRelease

      - name: Stage APK
        shell: bash
        run: cp app/build/outputs/apk/release/*.apk atv-app-list.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: atv-app-list-apk
          path: atv-app-list.apk
          if-no-files-found: error

      - name: Refresh rolling latest release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "atv-app-list.apk" \
            --title "latest (auto-build)" \
            --notes "Automatic build of commit ${GITHUB_SHA}.
          Direct download: https://github.com/unconditional/atv-app-list/releases/latest/download/atv-app-list.apk" \
            --target main

      - name: Create tag release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" "atv-app-list.apk" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}." \
            --latest
