name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.3.1'

      - name: Compute version name
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          gradle --no-daemon \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="${VERSION_NAME}" \
            :app:assembleRelease

      - name: Stage APK
        shell: bash
        run: cp app/build/outputs/apk/release/*.apk atv-app-list.apk

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: atv-app-list-apk
          path: atv-app-list.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atv-app-list-apk

      # Rolling channel stays continuously served: refresh the asset in the
      # existing release instead of delete-then-recreate (no 404 window).
      - name: Refresh rolling latest release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          NOTES="Automatic build of commit ${SHA}.
          Direct download: https://github.com/unconditional/atv-app-list/releases/latest/download/atv-app-list.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest atv-app-list.apk --clobber
            gh release edit latest --title "latest (auto-build)" --notes "$NOTES"
          else
            gh release create latest atv-app-list.apk \
              --title "latest (auto-build)" \
              --notes "$NOTES" \
              --target main
          fi

      - name: Create tag release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" atv-app-list.apk \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}." \
            --latest
